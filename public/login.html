<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>Log in</title>
        <link rel="stylesheet" href="/public/style.css" type="text/css">
        <link rel="icon" type="image/x-icon" href="/public/favicon.ico">

    </head>
    <body>  

        <div class="login">
        <!-- sto action benei to idio pragma me to app.post(path) -->
        <form>
            Username: <input id="username" type="text" name="username" value=""/> 
            Password: <input id="password" type="password" name="password" value=""/> 
            <input type="submit" id="submit" value="Log in"/>        
        </form>
        </div>

    <script>

let LoginForm = document.querySelector(".login form");
LoginForm.addEventListener('submit',LogIn);

function LogIn(event){
event.preventDefault();
//
let username = document.querySelector("#username").value;
let password = document.querySelector("#password").value;
//
fetch('/login/',{
  method: 'POST',
  headers: {
      'Content-Type': 'application/json'
    },
  body:JSON.stringify({
    username:username,
    password:password
  })
})
.then(res=>res.json())
.then(results=>{
if(results['msg'] == "Success"){

window.location.href = '/home/';
}
else if(results['msg'] == "Failure"){
alert('Wrong username and/or password');
}

//
})
.catch(error=>{console.log('Error: ',error)})

//to idio me to signup
}

    </script>
    
    </body>

</html>
