<div class="header">
  <div class="itemfetch">
    <button id="itemsbutton">Fetch Items</button>
  </div>

 <div class="itemupload">
  <form id="upload_form">
    <label for="upload">Upload products:</label>
    <input type="file" id="upload" name="file"/>
    <input type="submit" id="submit" value="Upload products"/>
  </form> 
 </div>

  <div class="logout">
    <a href="/logout/">Logout</a>
  </div>
</div>
<!----------------------->
<div class="flex-container">
  <div id="map" style="width: 900px; height : 580px"></div>
  <div class="register-rescuer">
    
    <form>
      <label for="username">Username:</label>
      <input id="username" type="text" name="username" value=""/> 
      <label for="password">Password:</label>
      <input id="password" type="password" name="password" value=""/>
      <label for="firstname">First name:</label>
      <input id="firstname" type="text" name="firstname" value=""/>
      <label for="lastname">Last Name:</label>
      <input id="lastname" type="text" name="lastname" value=""/>
      <label for="telephone">Telephone:</label>
      <input id="telephone" type="tel" name="telephone" value=""/>
      <input id="latitude" name="latitude" type="hidden" value="" />
      <input id="longitude" name="longitude" type="hidden" value="" />
      <input type="submit" value="Sign up"/>

  </div>
</div>

<h1>You can filter the inventory and Cargos here</h1>
<table id="filter_categories">

</table>
<!------------------------>
<h1>Inventory and all Rescuer Cargos</h1>
  <table id="items">
    <thead>
      <tr>
        <th id="items_inventory" colspan="2">Inventory</th>
      </tr>
      <tr>
        <th id="items_item">Item</th>
        <th id="items_quantity">Quantity</th>
      </tr>
    </thead>
    <tbody id="inventory_body">
    
    </tbody>
    
    </table>
    <!----------------------->
    <h1>Add an Item Category</h1>
    <form class="category">

      <label for="category_name">Category Name:</label>
      <input id="category_name" type="text"/>
      <label for="category_id">Enter an Id:</label>
      <input id="category_id" type="text"/>
      <button type="submit" value="">Add Category</button>
      
      </form>
      <!---------------------->
      <h1>Add an Item</h1>
      <form class="items">

        <label for="item_name">Item Name:</label>
        <input id="item_name" type="text"/>
        <label for="item_id">Item Id:</label>
        <input id="item_id" type="text"/>
        <label for="category_name">Category:</label>
        <select id="item_category_name"></select>
        <button type="submit" value="">Add Item</button>
        </form>
 <!------------------------------------------------------------------------------------> 
      <h1>Update an item in the inventory or add a new one alongside its quantity</h1>
      <form class="update_inventory_form">
        <select id="inventory_items"></select>
        <label for="adding_quantity">Enter Quantity here:</label>
        <input type="text" id="adding_quantity" name="adding_quantity">
        <button type="submit">Add/Update Item</button>
      </form>
 
<!--------Ousiastika edo tha boun oi anakoinoseis multiple dropdown ------------------->

            <select>
              <option>Choose Items</option>
            </select> 
          </div>
            <div class="announcement_items">
          
            </div>
          </div>
          <!---------------------->
          <textarea id="announcement_text" name="announcement_text" rows="4" cols="50"></textarea>
          <br>
          <button type="submit" value="">Submit Announcement</button>
      </form>
