<!DOCTYPE html>
<html>

<head>
    <meta charset=utf-8>
    <link rel = "stylesheet" href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="/public/css/homepage.css" type="text/css">
    <link rel="icon" type="image/x-icon" href="/public/img/favicon.ico">

    <title>This is the homepage</title>
</head>
<body>
<!--------------------->
<div class="header">

  <div class="logout">
    <a href="/logout/">Logout</a>
  </div>

</div>

<div class="flex-container">
  <div id="map" style="width: 900px; height : 580px"></div>
  <div class="panel">
    <h2>
      Categories
    </h2>
      <select name="categories" id="categories"></select>
      <select name="items" id="items"></select>
      <input type="text" id="request_quantity" name="request_quantity">
      <button type= "button" name="request" id="request">Submit request</button>
   
    <table id="requests">
      <thead>
        <tr>
          <th>Item</th>
          <th>Quantity</th>
          <th>Withdrawal Date</th>
          <th>Complete Date</td>
        </tr>

      </thead>
    <tbody id="requests_body"></tbody>
    </table>
   
  </div>
</div>
<!--------------------->
<h1>Your Offers</h1>
<table id="offers">
  <thead>
    <tr>
      <th>Item</th>
      <th>Quantity</th>
      <th>Withdrawal Date</th>
      <th>Complete Date</th>
    </tr>

  </thead>
<tbody id="offers_body"></tbody>
</table>

<!---------------------------------------->
<dialog>
    <form id="dialog_form" method="dialog">
      <label for="offer_quantity">How much you offer?</label>
      <input type="text" id="offer_quantity" name="offer_quantity">
      <button  value="cancel">Cancel</button>
      <button id="confirm" value="confirm">Confirm</button>
    </form>

</dialog>
<h1>Base Announcements</h1>
<div class="citizen_announcements"></div>

<script src="/public/js/citizen.js"></script> 
 
</body>

</html>
