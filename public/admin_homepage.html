<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
    <link rel="stylesheet" href="/public/homepage.css" type="text/css">
    <link rel = "stylesheet" href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.2/dist/leaflet-search.min.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-search/3.0.2/leaflet-search.min.js"></script>
<title>Welcome Admin!</title>
</head>
<body>
<div class="flex-container">
  <div id="map" style="width: 900px; height : 580px"></div>
  <div class="register-rescuer">
    <form action="/register_rescuer/" method="post" >
      Username: <input id="username" type="text" name="username" value=""/> 
            Password: <input id="password" type="password" name="password" value=""/>
            First name: <input id="firstname" type="text" name="firstname" value=""/>
            Last name: <input id="lastname" type="text" name="lastname" value=""/>
            Telephone: <input id="telephone" type="tel" name="telephone" value=""/>
            <input id="latitude" name="latitude" type="hidden" value="" />
            <input id="longitude" name="longitude" type="hidden" value="" />
            <input type="submit" value="Sign up"/>
    </form>

  </div>
</div>
<!---->
<!----------Form gia na kano upload to json ton proionton---------------->
<form action="/upload_products/" method="post" enctype="multipart/form-data">
  <label for="upload">Upload products:</label>
  <input type="file" id="upload" name="upload"/>
  <input type="submit" id="submit" value="Upload products"/>
</form> 
<script>

let map = L.map('map'); //ftaxno mono ton xarti. Den exo ta tiles, prostithentai meta
//
let tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
     attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
   });//vazo ta tiles tou OSM
tiles.addTo(map);//prostheto ta tiles tou OSM ston xarti
map.setView([38.24,21.73],16);//orizo tis syntetagmenes tou shmeiou sto opoio tha kentrarei o xarths kai to zoom level
//
var redIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});

var greenIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
//
var blackIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-black.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
//
var yellowIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-yellow.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
/*******gia na kano eggrafi ton rescuer***/
let rescuer_marker = L.marker([38.24,21.73],{draggable:true,icon:blackIcon});
rescuer_marker.bindPopup('Register');
rescuer_marker.addTo(map);
//
rescuer_marker.addEventListener('dragend',event=>{
let lat = rescuer_marker.getLatLng().lat;
let long = rescuer_marker.getLatLng().lng;
document.querySelector("#latitude").value = lat;
document.querySelector("#longitude").value = long;
console.log(lat,long);

});
//base marker
let base = L.marker([38.24,21.73],{draggable:true,icon:greenIcon});
base.bindPopup('This is a popup');// 'syndeo' ton marker me to popup
base.addTo(map);//prostheto ton marker ston xarth
//
/**** os admin vlepo th vash****/
fetch('/get_base/')
.then(res=>{return res.json();})
.then(data=>{
base.setLatLng([data[0]['ST_X(cords)'],data[0]['ST_Y(cords)']]);
base.bindPopup('Base');
//base.addTo(map);
})
.catch(error=>{console.log('Error: ',error);})

/*******os Admin epishs vlepo olous tous diasostes/oximata****/
let vehicles = L.layerGroup();
let v = null;
fetch('/get_vehicles/')
.then(res=>{return res.json();})
.then(cords=>{

for(let cord of cords){
  v= L.marker([cord['ST_X(cords)'],cord['ST_Y(cords)']],{draggable:false,icon:redIcon});
  v.bindPopup(`${cord['username']}`);
  vehicles.addLayer(v);//ekkremei to username tou oximatos
}
vehicles.addTo(map);
})
.catch(error=>{console.log('Error: ',error);})
/*******/

/****Epivevaiosh gia allagh ths topothesias ths vashs***/
//

var starting_lat,starting_long;
base.addEventListener('dragend', (event) => {
//dragend otan teliosei to drag kai pesei o marker sth thesh emfanizei parathyro epivevaiosis
if(confirm('Confirm Changes?')){//an patiso OK-epivevaiosi tote stelno ta trexonta cords sth vash lanontas update ta cords tou pinaka
  let lat = base.getLatLng().lat;
  let long = base.getLatLng().lng;
  console.log(lat,long);
  //
fetch('/change_base/',{
  method:'POST',
  headers: { 'Content-Type':'application/json' },
  body: JSON.stringify({
    latitude: lat,
    longitude: long
  })
})
.then(res=>{return res.json();})
.then(json=>{console.log(json);})
.catch(error=>{console.log('Error :' + error);});
//


base.bindPopup('Lat: ' + lat + ', Long: ' + long);
console.log('Lat: ' + lat + ', Long: ' + long);
}
else{
  //an akyroso thn allagh patontas cancel oi syntetagmenes tou marker einai oi proigoumenes
  //meso ths setLatLng tis ksanallazo gia na parei o marker tis arxikes prin tin allagh
  base.setLatLng([starting_lat, starting_long]);

}

});
//
base.addEventListener('dragstart',event=>{
// otan KSEKINAO na travao ton marker pare tis syntetagmenes tou(tis arxikes tou diladi)
starting_lat = base.getLatLng().lat;
starting_long = base.getLatLng().lng;
console.log(starting_lat,starting_long);
});
/****************/
/*
fetch('https://cors-anywhere.herokuapp.com/'+'http://usidas.ceid.upatras.gr/web/2023/export.php')
.then(res=>{return res.json();})
.then(data=>{console.log(data.items);})

fetch('/fetch_requests/')
.then(res=>res.json())
.then(requests=>{
display_requests(requests);
//

})
.catch(error=>{console.log('Error: ',error);})
/********/
function display_requests(requests){
let first_name,last_name,telephone,entry_date,item,quantity,withdrawal_date,vehicle_username,lat,long;
let request_marker,lifted;
for(let request of requests){
  first_name = request['citizen_first_name'];
  last_name = request['citizen_last_name'];
  telephone = request['citizen_telephone'];
  entry_date = request['entry_date'];
  item = request['item'];
  quantity = request['quantity'];
  withdrawal_date = request['withdrawal_date'];
  vehicle_username = request['vehicle_username'];
  lat = request['ST_X(cords)'];
  long = request['ST_Y(cords)'];
  lifted = request['lifted'];
  request_marker = L.marker([lat,long],{draggable:false});
  //variables
  let popup = `User name: ${first_name},${last_name}<br>Telephone: ${telephone}<br>Entry date: ${entry_date}<br>Item: ${item}<br>Quantity: ${quantity}<br>`;
  if(lifted == true){
    request_marker.setIcon(yellowIcon);
    request_marker.bindPopup(popup + `Withdrawal_date: ${withdrawal_date}<br>Vehicle: ${vehicle_username}`);
    request_marker.addTo(map);
  }
  else{
    request_marker.bindPopup(popup);
    request_marker.addTo(map);
  }
}

}


</script>



</body>





</html>
