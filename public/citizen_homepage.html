function findMatches(search){
if(!search) search = null;
return citizens.filter(citizen=>{//h filter filtrarei ta stixia tou citizens diladi epistrefei tous citizens pou ikanopoioun th synarthsh-orisma
const regex = new RegExp(search,'gi');//ftiaxno ena object regexp me orismata th leksh pou psaxno kai 'gi'. dhladh o,ti tairiazei me th leksh pou pliktrologo
return citizen.username.match(regex);//epestrepse matches ths lekshs anazitisis(kanonikis kefrasis) me ta username ton politon
});
}
