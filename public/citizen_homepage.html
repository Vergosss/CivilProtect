<!DOCTYPE html>
<html>

<head>
    <meta charset=utf-8>
    <link rel="stylesheet" href="/public/homepage.css" type="text/css">
    <link rel = "stylesheet" href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.2/dist/leaflet-search.min.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-search/3.0.2/leaflet-search.min.js"></script>
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico">

    <title>This is the homepage</title>
</head>
<body>
<!--------------------->
<div class="flex-container">
  <div id="map" style="width: 900px; height : 580px"></div>
  <div class="panel">
    <h2>
      Categories
      <select name="categories" id="categories"></select>
      <select name="items" id="items"></select>
      <button type= "button" name="request" id="request">Submit request</button>
    </h2>
    <table id="requests">
      <tr>
      <th>Entry Date</th>
      <th>Item</th>
      <th>Quantity</th>
    </tr>
    </table>
    <button type="button" name="reload" id="reload">Reload</button>
  </div>
</div>
<!--------------------->
<p>
  <b>This is the homepage. You have been redirected here after login.</b>

</p>
<a href="/logout"><button>Log out</button></a>

<h2>Search Citizens</h2>
<input type="text" id="search" placeholder="Find Citizen...">
<div id="citizens"></div>

<!----------Form gia na kano upload to json ton proionton---------------->

<script>
let map = L.map('map'); //ftaxno mono ton xarti. Den exo ta tiles, prostithentai meta

let tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
     attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
   });//vazo ta tiles tou OSM
tiles.addTo(map);//prostheto ta tiles tou OSM ston xarti
map.setView([38.24,21.73],16);//orizo tis syntetagmenes tou shmeiou sto opoio tha kentrarei o xarths kai to zoom level
//

//console.log(marker.getLatLng().lat,marker.getLatLng().lng);

/*************************************/
let base = L.marker([38.24,21.73],{draggable:false});
/*********************/
fetch('/get_base/')
.then(res=>{return res.json();})
.then(data=>{
base.setLatLng([data[0]['ST_X(cords)'],data[0]['ST_Y(cords)']]);
base.bindPopup('Base');
base.addTo(map);
})
.catch(error=>{console.log('Error: ',error);})
/****************/
/*****os admin vlepo th vash****/


/**************************/
fetch('/citizens/')
.then (res=>{return res.json();})
.then(json=>{//omoio se logikh me to apo pano
citizens = json;
//douleia me tous polites
showCitizens();
})
.catch(error=>{console.log('Error: ' + error);});
//
const input = document.querySelector("#search");
const div = document.querySelector("#citizens"); //me thn querySelector epilego to searchbar kai thn
//perioxh(div) pou tha xoresoun oi citizens(to apotelesma tou autocomplete)
/********fetch tis katigories ton proionton gia na fortothoun se ena dropdown menu***/
fetch('/get_categories/')
.then(res=>res.json())
.then(categories=>{
var list = document.querySelector('#categories');

for(let cat of categories){
var option = document.createElement('option');
option.innerHTML = cat['category_name'];
option.value = cat['category_name'];
list.appendChild(option);//prosthese kathe option sto select menu
}
})
.catch(error=>{console.log('Error: ',error);})
//
/********fetch ta idia ta proionta gia na fortothoun se ena dropdown menu**/
fetch('/get_items')
.then(res=>res.json())
.then(items=>{
  var item_list = document.querySelector('#items');
  for(let item of items){
    var option = document.createElement('option');
    option.innerHTML = item['name'];
    option.value = item['name'];
    item_list.appendChild(option);
  }
  
})
.catch(error=>{console.log('Error: ',error);})
//
/******perno ta cords tou polith gia xrhsh metepeita**/
var lat,long; 
let request_marker = L.marker([38.24,21.73],{draggable:false}); 
fetch('/get_coordinates/')
.then(res=>res.json())
.then(cords=>{
  lat = cords[0]['ST_X(cords)'];
  long = cords[0]['ST_Y(cords)'];
  //console.log(cords[0]['ST_X(cords)'],cords[0]['ST_Y(cords)']);
  request_marker.setLatLng([lat,long]);
  request_marker.addTo(map);
})
.catch(error=>{console.log('Error: ',error);})

 /*****/
/******Dimiourgia aithmatos apo ton polith******/
var requested_item;
let popup = document.createElement('div');

const request_button = document.querySelector("#request");
request_button.addEventListener('click',event=>{
  requested_item = document.querySelector("#items").value;
  fetch('/request/',{
  method:'POST',
  headers: { 'Content-Type':'application/json' },
  body: JSON.stringify({
    item: requested_item,
    //lat: lat,
    //long: long 
  })

})
.then(res=>res.json())
.then(data=>{
//afou kano insert to request sth vash
//tote enimerose ton marker
let par = document.createElement('p');
par.innerHTML = `${requested_item}<br>`;
popup.appendChild(par);
request_marker.bindPopup(popup);

})
.catch(error=>{console.log('Error: ',error);})
//


});
/*******Provoli ton aitimaton tou xristi(san istoriko)**/
fetch('/receive_requests/')
.then(res=>res.json())
.then(requests=>{
let tr,td;
const table = document.querySelector("#requests");
for(request of requests){
tr = document.createElement('tr');
for(req in request){
  td = document.createElement('td');
  td.innerHTML = String(request[req]);
  tr.appendChild(td);
}
table.appendChild(tr);
}


})
.catch(error=>{console.log('Error: ',error);})

/*********/
function showCitizens(){
  /*
for(let i =0;i<citizens.length;i++){
console.log(citizens[i]['username']);
}
*/
const matches = findMatches(this.value);
//h map paei se kathe stixio tou array 1-1 kai trexei se kathe stixio 1-1 th synartisi orisma
matches.map(citizen=>{
div.innerHTML = "";
let p = document.createElement("p");
let span = document.createElement("span");
span.innerHTML = citizen.username;
p.appendChild(span);
div.appendChild(p);
p.addEventListener('click',()=>{
input.value = span.innerHTML;

});

});


}
/****************/

/**************/
function findMatches(search){
if(!search) search = null;
return citizens.filter(citizen=>{//h filter filtrarei ta stixia tou citizens diladi epistrefei tous citizens pou ikanopoioun th synarthsh-orisma
const regex = new RegExp(search,'gi');//ftiaxno ena object regexp me orismata th leksh pou psaxno kai 'gi'. dhladh o,ti tairiazei me th leksh pou pliktrologo
return citizen.username.match(regex);//epestrepse matches ths lekshs anazitisis(kanonikis kefrasis) me ta username ton politon
});
}

//const  = document.querySelector("#search");
input.addEventListener("keyup",showCitizens);//enas event listener otan pliktrologiso kai AFISO to pliktro trexei h showCitizens
/********klhsh sto url to json************/

 </script> 
 
</body>

</html>
