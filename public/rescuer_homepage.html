<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel = "stylesheet" href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.2/dist/leaflet-search.min.css" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-search/3.0.2/leaflet-search.min.js"></script>

    <title>Welcome Rescuer!</title>
</head>

<body>

<div id="map" style="width: 900px; height : 580px"></div>
<script>

let map = L.map('map'); //ftaxno mono ton xarti. Den exo ta tiles, prostithentai meta

let tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
     attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
   });//vazo ta tiles tou OSM
tiles.addTo(map);//prostheto ta tiles tou OSM ston xarti
map.setView([38.24,21.73],16);//orizo tis syntetagmenes tou shmeiou sto opoio tha kentrarei o xarths kai to zoom level
var greenIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
//
var redIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
//
let base = L.marker([38.24,21.73],{draggable:false,icon:greenIcon});
base.addTo(map);
/**********arxikopoihseis****/
/****Mono fetch giati o diasostis vlepei th vash den thn allazei*/
fetch('/get_base/')
.then(res=>{return res.json();})
.then(data=>{
base.setLatLng([data[0]['ST_X(cords)'],data[0]['ST_Y(cords)']]);
base.bindPopup('Base');
base.addTo(map);
})
.catch(error=>{console.log('Error: ',error);})
/********/
/*****Thelo fetch kai ta cords aytounou mono(vlepei th thesh tou kai mono o diasostis oxi allous diasostes) *********/
let vehicle = L.marker([38.24,21.73],{draggable:true,icon:redIcon});
vehicle.addTo(map);
fetch('/get_vehicle/')
.then(res=>{return res.json();})
.then(data=>{
vehicle.setLatLng([data[0]['ST_X(cords)'],data[0]['ST_Y(cords)']]);
vehicle.bindPopup('Your vehicle');
vehicle.addTo(map);
})
.catch(error=>{console.log('Error: ',error);})
/*******Allagh ton cords tou (oximatos) diasosti me click kai drag*****/

vehicle.addEventListener('dragend',event => {
//get the cords after dragend
let lat = vehicle.getLatLng().lat;
let long = vehicle.getLatLng().lng;
fetch('/update_vehicle/',{
    method:'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify({
        latitude: lat,
        longitude: long
    })
})
.then(res=>{return res.json();})
.then(data=>{console.log(data);})
.catch(error=>{console.log('Error: ',error);})


});




</script>


</body>



</html>
