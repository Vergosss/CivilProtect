/**********Update Inventory Table*******/
function update_inventory_table(updated_inventory){
  const tbody = document.querySelector("#inventory_body");
  //
  tbody.innerHTML = "";
  for(let product of updated_inventory){
    let tr = document.createElement('tr');
    for(let key in product){
      let td = document.createElement('td');
      if(key == 'quantity'){
        let select = document.createElement('select');
        for(let i=1;i<=product[key];i++){
          let option = document.createElement('option');
          option.value = i;
          option.innerHTML = i;
          select.appendChild(option);
        }
        td.appendChild(select);
      }
      else{
        td.innerHTML = product[key];
      }
      tr.appendChild(td);
    }
    //appending the checkbox
    let td = document.createElement('td');
    const checkbox = document.createElement('input');
    checkbox.setAttribute('type','checkbox');
    td.appendChild(checkbox);
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
}

function show_requests(requests){
//xrhsimopoiei to vehicle thelei prosoxi-fix
  let requests_group = L.layerGroup();//vazo se ena group ta requests
  for(let request of requests){
    let undertake_button;
    let request_id = request['request_id'];
    let username = request['username'];
    let first_name = request['citizen_first_name'];
    let last_name = request['citizen_last_name'];
    let telephone = request['citizen_telephone'];
    let entry_date = request['entry_date'];
    let item = request['item'];
    let quantity = request['quantity'];
    let lat = request['ST_X(cords)'];
    let long = request['ST_Y(cords)'];
    let lifted = request['lifted'];
//variables
    let request_marker = L.marker([lat,long],{draggable:false,lifted:lifted});
    if(lifted == true){
      request_marker.setIcon(yellowIcon);
      //
      lifted_requests.addLayer(request_marker);
      //
      let cords = [[request_marker.getLatLng().lat,request_marker.getLatLng().lng],[vehicle.getLatLng().lat,vehicle.getLatLng().lng]];
      let line = L.polyline(cords,{color:'green'});
      //line.addTo(map);
      lines.addLayer(line);
    } 
    else{
      unlifted_requests.addLayer(request_marker);
    }
    let popup = `<div class ="popup">Name : ${first_name},${last_name}<br>Telephone: ${telephone}<br>Entry: ${entry_date}<br>Item: ${item}<br>Quantity: ${quantity}<br><div id="undertake_button"></div></div>`;
    request_marker.bindPopup(popup);

    //otan anigei o marker(to popup tou)
    request_marker.on('popupopen',function (){
    const button = document.createElement('button');
    button.innerHTML = 'Undertake Task';
    //an valo to koubi edo ousiastika kathe fora pou anigei to popup dimiourgitai koubi kai prostithetai
    //diladi to button einai topiko mono sto ekastote 'anigma tou popup marker'.ara me ayto de stackarontai ta event listeners
    //afou se kathe anigma exo diaforetiko koubi. kai adeiazei se kathe anigoklima giati einai energo mono sto anigma
    const undertake_button = document.querySelector("#undertake_button");
    undertake_button.appendChild(button);
    //marker work
    console.log(lifted);
    if(lifted == 1){
    button.disabled = true;
    }
    //to koubi prepei na menei energopoihmeno gia oso exei analifthei apo ton rescuer
    else{ 
      //console.log(lifted);
   
      button.addEventListener('click',event=>{
      //kodikas gia analavi task
      button.disabled = true;
      this.setIcon(yellowIcon);//apenergopoihse to koubi,kane yellow ton marker kai alakse thn
      //katastasi se oti exei analifthei gia na mhn
      lifted = true;//gia na mhn ksanaenergopoihthei to koubi an ksanaanikso to popup
      let cords = [[this.getLatLng().lat,this.getLatLng().lng],[vehicle.getLatLng().lat,vehicle.getLatLng().lng]];
      let line = L.polyline(cords,{color:'green'});
      line.addTo(map);
      /**********/
      insert_record(first_name,last_name,telephone,entry_date,item,quantity,request_id,username);
      create_task(username,request_id,first_name,last_name,telephone,item);
      //create_task(username);
    });
   
  }
   
    });
    //

    //
    requests_group.addLayer(request_marker);

  }
  unlifted_requests.addTo(map);
  lifted_requests.addTo(map);//vazo ta layer groups ston xarth
  requests_group.addTo(map);
  lines.addTo(map);
  filter.addOverlay(unlifted_requests,'Free Requests');
  filter.addOverlay(lifted_requests,'Taken Requests');
  filter.addOverlay(lines,'Connections');
}

/*****Creating a task after clicking on the request/offer button******/
function create_task(username,request_id,first_name,last_name,telephone,item){

fetch('/create_task/',{
    method:'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify({
      username:username,
      request_id:request_id,
      first_name:first_name,
      last_name:last_name,
      telephone:telephone,
      item:item
    })
})
.then(res=>res.json())
.then(updated_tasks=>{
//ananeoso me AJAX ton pinaka ton task tou diasosti
update_tasks_table(updated_tasks);
//

//
})
.catch(error=>{console.log('Error: ',error);})

}
/*************Enimerose ton pinaka me ta tasks******/
function update_tasks_table(updated_tasks){
  const tbody = document.querySelector("#tasks_body");
  tbody.innerHTML = "";
  //
  for(let task of updated_tasks){
  let tr = document.createElement('tr');//gia kathe object pou fetchara ftiaxno ena table row
for(let tsk in task){//diatrexo kathe kleidi-timh tou object
  let td = document.createElement('td');//gia kathe pedio tou object dimiourgo ena table data element kai tou vazo timi thn timh tou ekastote pediou tou object
  td.innerHTML = String(task[tsk]);
  if(tsk == 'task_id' || tsk == 'username'){
    td.style.display = 'none';
  }
  tr.appendChild(td);//vazo ayto to table data element sto row/grammh

}
//koubia
let complete = document.createElement('td');
const complete_button = document.createElement('button');
complete_button.innerHTML = 'Complete';
complete_button.addEventListener('click',Complete);
//
complete.appendChild(complete_button);

tr.appendChild(complete);
//
let cancel = document.createElement('td');
const cancel_button = document.createElement('button');
cancel_button.innerHTML = 'Cancel';
//event listeners
cancel_button.addEventListener('click',Cancel);
//
cancel.appendChild(cancel_button);
tr.appendChild(cancel);
//ftiaxno ta dyo zhtoumena koubia
tbody.appendChild(tr);
//

}

//After finishing iterating tasks object...

}
