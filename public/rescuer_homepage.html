<script>

let map = L.map('map'); //ftaxno mono ton xarti. Den exo ta tiles, prostithentai meta

let tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
     attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
   });//vazo ta tiles tou OSM
tiles.addTo(map);//prostheto ta tiles tou OSM ston xarti
map.setView([38.24,21.73],16);//orizo tis syntetagmenes tou shmeiou sto opoio tha kentrarei o xarths kai to zoom level
var greenIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
//
var redIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
//
var yellowIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-yellow.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
//Diloseis metavliton gia ta filters
var  lifted_requests = L.layerGroup();
var unlifted_requests = L.layerGroup();
var lines = L.layerGroup();
var filter = L.control.layers();
filter.addTo(map);
//
let base = L.marker([38.24,21.73],{draggable:false,icon:greenIcon});
base.addTo(map);
/**********arxikopoihseis****/
/****Mono fetch giati o diasostis vlepei th vash den thn allazei*/
fetch('/get_base/')
.then(res=>{return res.json();})
.then(data=>{
base.setLatLng([data[0]['ST_X(cords)'],data[0]['ST_Y(cords)']]);
base.bindPopup('Base');
base.addTo(map);
})
.catch(error=>{console.log('Error: ',error);})
/**********Inventory***************/



fetch('/load_inventory/')
.then(res=>res.json())
.then(inventory=>{
const inventory_table = document.querySelector("#inventory");
for(let product of inventory){
let tr = document.createElement('tr');
for(field in product){
let td = document.createElement('td');
if(field == 'quantity'){
  let select = document.createElement('select');
  for(let i=1;i<=product['quantity'];i++){
    let option = document.createElement('option');
    option.value = i;
    option.innerHTML = i;
    select.appendChild(option);
  }
  td.appendChild(select);
}
else{
  td.innerHTML = product[field];
}

tr.appendChild(td);

}
let td = document.createElement('td');
const checkbox = document.createElement('input');
checkbox.setAttribute('type','checkbox');
td.appendChild(checkbox);
tr.appendChild(td);
inventory_table.appendChild(tr);
}

})
.catch(error=>{console.log('Error: ',error);})







/*************************/
/*****Thelo fetch kai ta cords aytounou mono(vlepei th thesh tou kai mono o diasostis oxi allous diasostes) *********/
let vehicle = L.marker([38.24,21.73],{draggable:true,icon:redIcon});
vehicle.addTo(map);
fetch('/get_vehicle/')
.then(res=>{return res.json();})
.then(data=>{
vehicle.setLatLng([data[0]['ST_X(cords)'],data[0]['ST_Y(cords)']]);
vehicle.bindPopup('Your vehicle');
vehicle.addTo(map);
//
return fetch('/get_requests/');
})
.then(res=>res.json())
.then(requests=>{//chainaro ta promises
  //show_requests(requests);
  show_requests2(requests);
  //test
  //
})
.catch(error=>{console.log('Error: ',error);})
//
/*******Allagh ton cords tou (oximatos) diasosti me click kai drag*****/
document.querySelector("#fortosi").disabled = true;
document.querySelector("#ekfortosi").disabled = true;
//
vehicle.addEventListener('dragend',event => {
//get the cords after dragend
let lat = vehicle.getLatLng().lat;
let long = vehicle.getLatLng().lng;
const fortosi = document.querySelector("#fortosi");
const ekfortosi = document.querySelector("#ekfortosi");
//an o rescuer einai entos 100 metron apo th vash
//update cords in database
fetch('/update_vehicle/',{
    method:'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify({
        latitude: lat,
        longitude: long
    })
})
.then(res=>{return res.json();})
.then(data=>{console.log(data);})
.catch(error=>{console.log('Error: ',error);})
//
if(Distance(vehicle,base) < 100){
//energopoio thn fortosi/ekfortosi
fortosi.disabled = false;
ekfortosi.disabled = false;
}
else{
  fortosi.disabled = true;
  ekfortosi.disabled = true;
}
});
/*******************************/
const load = document.querySelector("#fortosi");
const unload = document.querySelector("#ekfortosi");
//Event listeners
load.addEventListener('click',event=>{
//perno-epilego ta proionta apo tin apothiki/pinaka/oti einai telos panton
//logika pinakas me grammh: eidos-posotita(select ?)
//ta stelno sth vash gia na enimeroso to cargo
const inventory = document.querySelector("#inventory");
let cargo_add = {};
for(let row of inventory.rows){
  for(let cell of row.cells){
    //console.log(cell.innerHTML);
    //an to epomeno sibling einai null tote eimai sto telos tou pinaka
    //an to keli me to tick einai ticked
    //pare to quantity = stixio.parentNode.previousSibling.value
    //pare to item = stixio.parentNode.previousSibling.previousSibling.value
    //ftiakse ena object me item : quantity
    //console.log(cell.nextSibling);
    if(!cell.nextSibling){
      const checkbox = cell.firstChild;
      if(checkbox.checked){
      let item = cell.previousSibling.previousSibling.innerHTML;
      //let quantity = cell.previousSibling.innerHTML;
      //logika cell.previousSibling.firstChild.value
      let quantity = cell.previousSibling.firstChild.value
      cargo_add[item] = quantity;
      }
    }
  }
}

console.log(cargo_add);//meta stile sth DB me post ayto to object gia enimerosi tou cargo
//
update_cargo(cargo_add);//steile to json ton antikeimenon-posotiton pou fortose apo tin apothiki o diasostis
});
/*****************FETCH POST UPDATE CARGO*****/
function update_cargo(cargo_add){
  fetch('/update_cargo/',{
    method : 'POST',
    headers : { 'Content-Type':'application/json' },
    body : JSON.stringify(cargo_add)
  })
  .then(res=>res.json())
  .then(data=>{})
  .catch(error=>{console.log('Error : ',error);})
//
}

/*******Fetch ta requests kai offers pou den eksipiretountai apo allo oxhma***/
function show_requests2(requests){
const grouped_requests = Object.groupBy(requests,function({username}){
  return username;
});
//console.log(res);

/*******/

for (let user in grouped_requests){
let request_marker = L.marker([grouped_requests[user][0]['ST_X(cords)'],grouped_requests[user][0]['ST_Y(cords)']],{draggable:false});
let popup = document.createElement('div');
//
popup.style['max-height'] = "200px";

for (let request of grouped_requests[user]){

request_div.innerHTML = `Name : ${request['citizen_first_name']},${request['citizen_last_name']}<br>Telephone: ${request['citizen_telephone']}<br>Entry: ${request['entry_date']}<br>Item: ${request['item']}<br>Quantity: ${request['quantity']}<br>`
//
const button = document.createElement('button');
button.innerHTML = 'Undertake Task';
//
const undertake_button = document.createElement('div');
undertake_button.appendChild(button);
//
request_div.appendChild(undertake_button);
//
if(request['lifted'] == 1){

  //line.addTo(map);

}
//
popup.appendChild(request_div);
//
button.addEventListener('click',function(){
  this.disabled = true;
  request_marker.setIcon(yellowIcon);

  lines.addLayer(line);

lines.addTo(map);

/*********/
//
function show_requests(requests){
//xrhsimopoiei to vehicle thelei prosoxi-fix
  let requests_group = L.layerGroup();//vazo se ena group ta requests
  for(let request of requests){
    let undertake_button;
    let request_id = request['request_id'];
    let username = request['username'];
    let first_name = request['citizen_first_name'];
    let last_name = request['citizen_last_name'];
    let telephone = request['citizen_telephone'];
    let entry_date = request['entry_date'];
    let item = request['item'];
    let quantity = request['quantity'];
    let lat = request['ST_X(cords)'];
    let long = request['ST_Y(cords)'];
    let lifted = request['lifted'];
//variables
    let request_marker = L.marker([lat,long],{draggable:false,lifted:lifted});
    if(lifted == true){
      request_marker.setIcon(yellowIcon);
      //
      lifted_requests.addLayer(request_marker);
      //
      let cords = [[request_marker.getLatLng().lat,request_marker.getLatLng().lng],[vehicle.getLatLng().lat,vehicle.getLatLng().lng]];
      let line = L.polyline(cords,{color:'green'});
      //line.addTo(map);
      lines.addLayer(line);
    } 
    else{
      unlifted_requests.addLayer(request_marker);
    }
    let popup = `<div class ="popup">Name : ${first_name},${last_name}<br>Telephone: ${telephone}<br>Entry: ${entry_date}<br>Item: ${item}<br>Quantity: ${quantity}<br><div id="undertake_button"></div></div>`;
    request_marker.bindPopup(popup);

    //otan anigei o marker(to popup tou)
    request_marker.on('popupopen',function (){
    const button = document.createElement('button');
    button.innerHTML = 'Undertake Task';
    //an valo to koubi edo ousiastika kathe fora pou anigei to popup dimiourgitai koubi kai prostithetai
    //diladi to button einai topiko mono sto ekastote 'anigma tou popup marker'.ara me ayto de stackarontai ta event listeners
    //afou se kathe anigma exo diaforetiko koubi. kai adeiazei se kathe anigoklima giati einai energo mono sto anigma
    const undertake_button = document.querySelector("#undertake_button");
    undertake_button.appendChild(button);
    //marker work
    console.log(lifted);
    if(lifted == 1){
    button.disabled = true;
    }
    //to koubi prepei na menei energopoihmeno gia oso exei analifthei apo ton rescuer
    else{ 
      //console.log(lifted);
   
      button.addEventListener('click',event=>{
      //kodikas gia analavi task
      button.disabled = true;
      this.setIcon(yellowIcon);//apenergopoihse to koubi,kane yellow ton marker kai alakse thn
      //katastasi se oti exei analifthei gia na mhn
      lifted = true;//gia na mhn ksanaenergopoihthei to koubi an ksanaanikso to popup
      let cords = [[this.getLatLng().lat,this.getLatLng().lng],[vehicle.getLatLng().lat,vehicle.getLatLng().lng]];
      let line = L.polyline(cords,{color:'green'});
      line.addTo(map);
      /**********/
      insert_record(first_name,last_name,telephone,entry_date,item,quantity,request_id,username);
      create_task(username,request_id,first_name,last_name,telephone,item);
      //create_task(username);
    });
   
  }
   
    });
    //

    //
    requests_group.addLayer(request_marker);

  }
  unlifted_requests.addTo(map);
  lifted_requests.addTo(map);//vazo ta layer groups ston xarth
  requests_group.addTo(map);
  lines.addTo(map);
  filter.addOverlay(unlifted_requests,'Free Requests');
  filter.addOverlay(lifted_requests,'Taken Requests');
  filter.addOverlay(lines,'Connections');
}
/********Insert a record on the table****/
function insert_record(citizen_first_name,citizen_last_name,citizen_telephone,entry_date,item,quantity,tid,username){
  const table = document.querySelector("#tasks");
  const row = table.insertRow();
  const c1 = row.insertCell(0);
  const c2 = row.insertCell(1);
  const c3 = row.insertCell(2);
  const c4 = row.insertCell(3);
  const c5 = row.insertCell(4);
  const c6 = row.insertCell(5);
  const c7 = row.insertCell(6);
  const c8 = row.insertCell(7);
  const c9 = row.insertCell(8);
  const c10 = row.insertCell(9);
  c1.innerHTML = citizen_first_name;
  c2.innerHTML = citizen_last_name;
  c3.innerHTML = citizen_telephone;
  c4.innerHTML = entry_date;
  c5.innerHTML = item;
  c6.innerHTML = quantity;
  c7.innerHTML = tid;
  c8.innerHTML = username;
  c7.style.display = 'none';
  c8.style.display = 'none';
  //buttons
  const completebutton = document.createElement('button');
  const cancelbutton = document.createElement('button');
  //text
  completebutton.innerHTML = 'Complete';
  cancelbutton.innerHTML = 'Cancel';
  //add to table cells
  c9.appendChild(completebutton);
  c10.appendChild(cancelbutton);
  //event listeners
  completebutton.addEventListener('click',event=>{
    console.log('Clicked!');
    complete_task(tid);
  });
  //
  cancelbutton.addEventListener('click',function(){
    //me arrow function to this einai to windows ara o parent tou window einai undefined
    console.log('Clicked!');
    const row = this.parentNode.parentNode.rowIndex;
    table.deleteRow(row);
    cancel_task(tid);
  });
  /**************************/

  //

}

/*****Creating a task after clicking on the request/offer button******/
function create_task(username,request_id,first_name,last_name,telephone,item){

fetch('/create_task/',{
    method:'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify({
      username:username,
      request_id:request_id,
      first_name:first_name,
      last_name:last_name,
      telephone:telephone,
      item:item
    })
})
.then(res=>res.json())
.then(data=>{

})
.catch(error=>{console.log('Error: ',error);})

}
/********fetchare ta tasks kai dikse ta se enan pinaka*****/
fetch('/get_tasks/')
.then(res=>res.json())
.then(tasks=>{

  let tr,td;
  const table = document.querySelector("#tasks");
for(task of tasks){
  tr = document.createElement('tr');//gia kathe object pou fetchara ftiaxno ena table row
for(tsk in task){//diatrexo kathe kleidi-timh tou object
  td = document.createElement('td');//gia kathe pedio tou object dimiourgo ena table data element kai tou vazo timi thn timh tou ekastote pediou tou object
  td.innerHTML = String(task[tsk]);
  if(tsk == 'task_id' || tsk == 'username'){
    td.style.display = 'none';
  }
  tr.appendChild(td);//vazo ayto to table data element sto row/grammh

}
//koubia
complete = document.createElement('td');
complete.innerHTML = `<button class="completebutton">Complete</button>`;
tr.appendChild(complete);
cancel = document.createElement('td');
cancel.innerHTML = `<button class="cancelbutton">Cancel</button>`;
tr.appendChild(cancel);
//ftiaxno ta dyo zhtoumena koubia
table.appendChild(tr);
}
//
let complete_buttons = document.querySelectorAll(".completebutton");
for(let btn of complete_buttons){
  btn.addEventListener('click',function(){
    console.log('Clicked!');
    const id = this.parentNode.previousSibling.previousSibling;//o parent tou koubiou einai o container tou diladi
    console.log(id.innerHTML);//
    const tid = id.innerHTML;
    complete_task(tid);
  });
}
//event listeners
let cancel_buttons = document.querySelectorAll(".cancelbutton");
for(let btn of cancel_buttons){
  btn.addEventListener('click',function(){
    console.log('Clicked!');
    //get the task id cell
    const id = this.parentNode.previousSibling.previousSibling.previousSibling;
    //console.log(id.innerHTML);
    //get id cell value
    const tid = id.innerHTML;
    //delete row
    const row = this.parentNode.parentNode.rowIndex;//perno to id ths grammhs
    table.deleteRow(row);
    cancel_task(tid);
  });
}
})
.catch(error=>{console.log('Error: ',error);})
/****function pou oloklironei-diekperaionei ena task***/
function complete_task(tid){

fetch('/complete_task/',{
  method:'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify({
        tid: tid
    })
})
.then(res=>res.json())
.then(data=>{})
.catch(error=>{console.log('Error: ',error);})

}
/****Gia thn akyrosh tou task***/
function cancel_task(tid){
fetch('/cancel_task/',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
    tid:tid
  })
})
.then(res=>res.json())
.then(data=>{})
.catch(error=>{console.log('Error: ',error);})

}
/********************/
function Distance(vehicle,base){
  return map.distance([vehicle.getLatLng().lat,vehicle.getLatLng().lng],[base.getLatLng().lat,base.getLatLng().lng]);
}

</script>
